services:
  # Update this image
  web:
    image: 
    container_name: fuel-tracker-web
    command: python app.py
    volumes:
      - ./data:/app/data
    ports:
      - 5000:5000
    restart: unless-stopped
  # Update this image
  scheduler:
    image: 
    container_name: fuel-tracker-scheduler
    command: python scheduler.py
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    restart: unless-stopped
networks: {}